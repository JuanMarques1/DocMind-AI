# Blueprint do Render: backend (Docker) + banco Postgres.
# Importe em https://dashboard.render.com → New → Blueprint, apontando para este repo.
databases:
  - name: docmind-db
    plan: free
    databaseName: docmind
    user: docmind

services:
  - type: web
    name: docmind-api
    runtime: docker
    plan: free
    # Caminhos relativos à RAIZ do repositório (padrão de monorepo no Render).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      # Connection string do Postgres acima (injetada automaticamente).
      - key: DATABASE_URL
        fromDatabase:
          name: docmind-db
          property: connectionString
      # Defina no painel do Render (secreto). Vazio → usa o analisador mock.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      # Domínio da Vercel (ex.: https://docmind.vercel.app). Defina após o deploy do front.
      - key: FRONTEND_ORIGIN
        sync: false
